name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: windsliter
          POSTGRES_PASSWORD: windsliter
          POSTGRES_DB: windsliter
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U windsliter"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://windsliter:windsliter@localhost:5432/windsliter
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
